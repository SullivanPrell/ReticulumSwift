# Google developer documentation style guide, enforced with Vale.
#
#   https://developers.google.com/style   (CC BY 4.0)
#
# The rules live in .vale/styles/Google, a vendored copy of the Vale-compatible
# implementation at https://github.com/vale-cli/Google. A local reference copy of the
# prose guide itself is at ~/.claude/style-guides/google-devdocs/pages.
#
# Run:  vale Sources/ Tests/ *.md
#
# Vale reads comments only from .swift files, never code, so identifiers and string
# literals are never flagged.

StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Reticulum

[*.{md,swift}]
BasedOnStyles = Google

# --- Deliberate deviations -------------------------------------------------------
#
# Google.Parens ("use parentheses judiciously") fires 3675 times in Sources/ alone,
# almost entirely on this port's citation convention: every non-obvious behaviour names
# the Python line it mirrors, as `(Transport.py:294)`. Those citations are how parity is
# argued and re-verified against a moving upstream, so the convention stays and the rule
# is off rather than half-obeyed.
Google.Parens = NO

# Google.Acronyms is satisfied through the Reticulum vocabulary rather than by disabling
# it: protocol terms (RNS, MTU, IFAC, HDLC, WDCL), Swift's own `// MARK:` sections, and
# ALL-CAPS enum cases quoted in prose are accepted, so the rule still catches genuinely
# unexplained initialisms in new text.
