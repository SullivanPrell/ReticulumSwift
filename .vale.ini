# Google developer documentation style guide, enforced with Vale.
#
#   https://developers.google.com/style   (CC BY 4.0)
#
# The rules live in .vale/styles/Google, a vendored copy of the Vale-compatible
# implementation at https://github.com/vale-cli/Google. A local reference copy of the
# prose guide itself is at ~/.claude/style-guides/google-devdocs/pages.
#
# Run:  vale Sources/ Tests/ *.md
#
# Vale reads comments from .swift files, not code — with one measured exception. It does
# not follow that code is never linted: a doc comment that cites `Packet.PLAIN_MDU` or
# quotes the exact string a utility prints is prose to Vale, and its backticks carry no
# meaning outside Markdown. That distinction drives the per-format sections below.
#
# The exception: Vale's Swift scoping finds comments by scanning for `//`, it does not
# parse the language. A `//` inside a multi-line string literal therefore opens a comment
# that never existed, and the rest of that line is linted as prose. Reduced:
#
#     let a = """                              let a = """
#         the file is n//8 bytes — the tail          the file is n div 8 bytes — the tail
#         """                                        """
#     -> Google.EmDash fires                    -> no finding
#
# Acting on such a finding edits code, not a comment. Before committing a prose sweep run
#
#     git status --porcelain | awk '{print $NF}' | grep '\.swift$' \
#         | xargs python3 .vale/tools/verify_code_unchanged.py
#
# which strips comments from both revisions and compares what is left. It caught precisely
# this case in Tests/ReticulumSwiftTests/PacketHashlistParityTests.swift, whose assertion
# message contains `n × HASHLENGTH//8`.

StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Reticulum

[*.md]
BasedOnStyles = Google
Google.Parens = NO

[*.swift]
BasedOnStyles = Google
Google.Parens = NO

# --- Deviations that apply everywhere --------------------------------------------
#
# Google.Parens ("use parentheses judiciously") fires 3675 times in Sources/ alone,
# almost entirely on this port's citation convention: every non-obvious behaviour names
# the Python line it mirrors, as `(Transport.py:294)`. Those citations are how parity is
# argued and re-verified against a moving upstream, so the convention stays and the rule
# is off rather than half-obeyed.
#
# Google.Acronyms is satisfied through the Reticulum vocabulary rather than by disabling
# it: protocol terms (RNS, MTU, IFAC, HDLC, WDCL), Swift's own `// MARK:` sections, and
# ALL-CAPS enum cases quoted in prose are accepted, so the rule still catches genuinely
# unexplained initialisms in new text.

# --- Deviations specific to Swift comments ---------------------------------------
#
# Vale parses Markdown, so it knows a fenced block or a `code span` is not prose. It has
# no such parser for a Swift comment: the whole comment body is prose, backticks and all.
# Three rules are pure noise under that reading, and the Markdown side proves it — run
# against the same repo's .md files, where code spans *are* excluded, each scores zero:
#
#   Google.Spacing    429 hits in Swift, 0 in Markdown. Token '[a-z][.?!][A-Z]' matches
#                     the dot in every qualified identifier: `Packet.PLAIN_MDU` reads as
#                     a missing sentence space. All 429 were of that form; the genuine
#                     double-space-after-period hits were fixed and are not coming back.
#   Google.Ellipses   121 hits in Swift, 0 in Markdown, and every one is a code elision:
#                     `base64.b32encode(...)`, `FLAG ... FLAG`, `isOnline = ...`.
#   Google.Quotes     364 hits in Swift, 6 in Markdown. The rule moves commas and periods
#                     inside quotation marks; the guide itself excepts literal strings,
#                     and in these comments that is nearly all of them — `"rnstransport",`
#                     `"Path not found",` `"/",`. Moving the comma inside would state the
#                     wrong value.
#   Google.Units      32 hits in Swift, 0 in Markdown. Every one is inside a quoted
#                     expected output: `prettyTime` returns "0s", `prettySize` returns "2B".
#                     A nonbreaking space would state a value the code never produces.
#   Google.OptionalPlurals  3 hits in Swift, 0 in Markdown, all function names — Python's
#                     `bytes.fromhex(s)` and this port's `split(s)`, not "(s)" pluralisation.
#   Google.Ordinal    2 hits in Swift, 0 in Markdown: "the 32nd pair", "the 512th and last
#                     entry". The rule targets prose ordinals; spelling out an index into a
#                     512-entry ratchet table reads worse, not better.
#
# Each stays on for Markdown, where it earns its keep.
Google.Spacing = NO
Google.Ellipses = NO
Google.Quotes = NO
Google.Units = NO
Google.OptionalPlurals = NO
Google.Ordinal = NO

# --- Deviation scoped to one file ------------------------------------------------
#
#   Tests/ReticulumSwiftTests/PacketHashlistParityTests.swift   Google.EmDash 1. The
#                     assertion message is a """ literal holding `n × HASHLENGTH//8`, and
#                     that `//` opens a comment which does not exist, so the rest of the
#                     line is linted as prose. The finding is on code, not on a comment:
#                     see the scoping note at the top of this file.

[Tests/ReticulumSwiftTests/PacketHashlistParityTests.swift]
Google.EmDash = NO

# --- Findings left standing ------------------------------------------------------
#
# Three warnings survive a clean run and are correct prose:
#
#   Google.Will  3, all quoting upstream verbatim — Reticulum's own announce-priority
#                wording in AnnounceQueue.swift and the two tests that pin it, and
#                Identity.py:236-239 in StorageStartupTests.swift. Rewriting a citation
#                to present tense would misquote it.
#   Google.OxfordComma  1, CHANGELOG.md:1513. "discoverable and dialable" is a compound
#                adjective, not a list; the rule cannot see the difference.
