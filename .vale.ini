# Google developer documentation style guide, enforced with Vale.
#
#   https://developers.google.com/style   (CC BY 4.0)
#
# The rules live in .vale/styles/Google, a vendored copy of the Vale-compatible
# implementation at https://github.com/vale-cli/Google.
#
# Run:  vale Sources/ Tests/ *.md

StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Reticulum

[*.md]
BasedOnStyles = Google
Google.Parens = NO

[*.swift]
BasedOnStyles = Google
Google.Parens = NO

# Google.Parens: this port cites the Python line each non-obvious behaviour mirrors,
# as `(Transport.py:294)`. The rule reads every citation as a stray parenthetical.
#
# Google.Acronyms stays on, satisfied through the Reticulum vocabulary instead: protocol
# terms and wire constants (RNS, MTU, IFAC, HDLC, FEND), Swift's `MARK` directive and the
# `SPDX` license tag are accepted, so the rule still catches unexplained initialisms in
# new text.

# Vale parses Markdown, so it excludes a fenced block or a `code span` there. It has no
# such parser for a Swift comment, where the whole body is prose, backticks and all. The
# rules below fire on that difference, and stay on for Markdown.
#
#   Google.Spacing   Token '[a-z][.?!][A-Z]' matches the dot in a qualified identifier:
#                    `Packet.PLAIN_MDU` reads as a missing sentence space.
#   Google.Ellipses  Matches code elisions: `base64.b32encode(...)`, `isOnline = ...`.
#   Google.Quotes    Moves a comma or period inside the quotation marks. The guide
#                    excepts literal strings, and these quote values the code produces —
#                    `"rnstransport",` `"Path not found",`.
#   Google.Units     Fires inside quoted expected output: `prettyTime` returns "0s". A
#                    nonbreaking space would state a value the code never produces.
#   Google.OptionalPlurals  Matches function names: `bytes.fromhex(s)`, `split(s)`.
#   Google.Ordinal   Matches indexes into the ratchet table: "the 32nd pair".
Google.Spacing = NO
Google.Ellipses = NO
Google.Quotes = NO
Google.Units = NO
Google.OptionalPlurals = NO
Google.Ordinal = NO

# Vale finds Swift comments by scanning for `//`; it does not parse the language. The
# assertion message in this file is a `"""` literal holding `n × HASHLENGTH//8`, which
# opens a comment that does not exist, so the rest of the line lints as prose.
[Tests/ReticulumSwiftTests/PacketHashlistParityTests.swift]
Google.EmDash = NO
