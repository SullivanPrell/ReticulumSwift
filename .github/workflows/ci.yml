name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build & test (macOS)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout (with LFS for CI2PD binary)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      # Writing to a pipe, the test binary buffers 16 KiB of output at a time, so a
      # run that stops answering names no test and loses its last buffer. `script`
      # gives it a pty, which line-buffers instead; the prompt variables keep the
      # `git` the tests run from asking that pty anything. The watchdog samples a
      # process that has gone quiet before the step's own limit ends it.
      - name: Test
        timeout-minutes: 40
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: /usr/bin/false
        run: |
          ( sleep 1800
            pid=$(pgrep -n xctest) || exit 0
            echo "Quiet for 30 minutes. Sampling $pid:" >&2
            sample "$pid" 10 -f /dev/stderr ) &
          watchdog=$!
          status=0
          script -q /dev/null swift test < /dev/null || status=$?
          kill "$watchdog" 2>/dev/null || true
          exit $status

  style:
    name: Style (format, licenses, prose)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `swift format` ships with the toolchain from Swift 6.0 on. The image
      # carries several Xcodes and defaults to an older one, so select the
      # newest explicitly rather than relying on the image's default.
      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting: $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          swift --version

      # Pinned. The rules vendored in .vale/styles are the ones this version
      # ships, and a newer Vale can add or retune rules, which would fail a
      # tree nobody changed.
      - name: Install Vale
        env:
          VALE_VERSION: 3.20.0
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_macOS_arm64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/vale" --version

      # swift-fmt-check, check-licenses and lint-docs: the same target
      # contributors run before pushing. Nothing here builds or runs the code.
      - name: Check
        run: make check
